name: release

# Builds the static Linux tarballs: the binary, desktop entry and icons.
# release-plz creates the draft release and tag before this runs. The publish
# job attaches every asset before taking the release out of draft.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag of the release, such as v0.1.0
        required: true
        type: string
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: true

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, platform: x86_64-linux }
          - { target: aarch64-unknown-linux-musl, platform: aarch64-linux }
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add ${{ matrix.target }}
      - name: Install cross
        # Pinned so the musl builds (and their C compiler) stay reproducible.
        run: cargo install cross --locked --version 0.2.5
      - name: Build static binary
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: cross build --release --locked --target ${{ matrix.target }}
      - name: Package archive
        run: sh scripts/package.sh ${{ matrix.target }} ${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: dist/*.tar.xz
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*
      - name: Upload assets and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release upload "$TAG" dist/*.tar.xz --clobber --repo "$GITHUB_REPOSITORY"
          gh release edit "$TAG" --draft=false --repo "$GITHUB_REPOSITORY"
